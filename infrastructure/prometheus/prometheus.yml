global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "pageforge-agent"
    static_configs:
      - targets: ["agent:3001"]
    metrics_path: "/metrics"

  - job_name: "pageforge-worker"
    static_configs:
      - targets: ["worker:3002"]
    metrics_path: "/metrics"
