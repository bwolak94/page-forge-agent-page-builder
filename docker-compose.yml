services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pageforge
      POSTGRES_PASSWORD: pageforge
      POSTGRES_DB: pageforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pageforge"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
